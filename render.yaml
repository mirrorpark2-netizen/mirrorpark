services:
  - type: web
    name: mirror-park-operations
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mirror-park-db
          property: connectionString
      - key: MP_ADMIN_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: 22.22.0

databases:
  - name: mirror-park-db
    plan: free
    databaseName: mirror_park
    user: mirror_park
